name: CI
on:
  push:
    branches:
      # Change this if your primary branch is not main
      - main
  pull_request:

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Reads the pnpm version from package.json's packageManager field, so the
      # version that resolves the lockfile here is the one pinned in the repo.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          # Pinned via .nvmrc so CI, Netlify and local agree on the runtime.
          node-version-file: .nvmrc
          cache: 'pnpm'
      # This line enables distribution
      # The "--stop-agents-after" is optional, but allows idle agents to shut down once the "e2e-ci" targets have been requested
      # - run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"
      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - run: pnpm nx format:check
      - run: pnpm nx affected -t lint test build e2e-ci
