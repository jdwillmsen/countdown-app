name: CI
on:
  push:
    branches:
      # Change this if your primary branch is not main
      - main
  pull_request:

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Reads the pnpm version from package.json's packageManager field, so the
      # version that resolves the lockfile here is the one pinned in the repo.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Pinned via .nvmrc so CI, Netlify and local agree on the runtime.
          node-version-file: .nvmrc
          cache: 'pnpm'
      # This line enables distribution
      # The "--stop-agents-after" is optional, but allows idle agents to shut down once the "e2e-ci" targets have been requested
      # - run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # The pnpm cache above holds packages, not the Cypress binary: cypress's
      # install script downloads that separately into ~/.cache/Cypress, and
      # skips the download when the matching version is already there. Keyed on
      # the lockfile so a Cypress bump can never be served a stale binary.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - run: pnpm nx format:check
      # Release notes are only rendered on main after a merge; render them here
      # too so a dependency bump that breaks them fails its own pull request.
      - run: node tools/check-release-notes.mjs
      - run: pnpm nx affected -t lint test build e2e-ci
      # A failed e2e run is otherwise only a log line; the screenshots show what
      # the page actually rendered, which the runner cannot reproduce locally.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-artifacts
          path: dist/cypress
          if-no-files-found: ignore
          retention-days: 7
