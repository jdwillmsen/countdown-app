# pnpm does not run dependency build scripts unless a package is named here.
# These five need theirs: esbuild and cypress download platform binaries,
# @swc/core and @parcel/watcher build native bindings, and nx writes its own
# post-install artifacts. Declared in the repo rather than approved
# interactively so CI and Netlify install exactly what a developer does.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  cypress: true
  esbuild: true
  nx: true
